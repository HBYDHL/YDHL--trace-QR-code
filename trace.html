<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>钢筋套筒产品追溯</title>
<style>
body{font-family:sans-serif;background:#8B1A1A;padding:8px;margin:0}
.c{background:#FFF8E7;max-width:600px;margin:0 auto;border-radius:8px;overflow:hidden}
.h{background:#8B1A1A;color:#C9A84C;text-align:center;padding:12px;font-size:18px;font-weight:bold}
table{width:100%;border-collapse:collapse}
th{background:#8B1A1A;color:#FFD700;padding:5px;font-size:13px;border:1px solid #C9A84C}
td{padding:4px 6px;font-size:12px;border:1px solid #D4C5A0;color:#3B2F1A}
.l{color:#8B6914;font-weight:bold;white-space:nowrap;width:90px}
.f{text-align:center;padding:6px;font-size:10px;color:#8B6914;border-top:1px dashed #C9A84C}
.t{text-align:center;padding:8px;font-size:13px;color:#8B1A1A;font-weight:bold;border-top:1px solid #C9A84C}
.e{text-align:center;padding:20px;color:#8B1A1A}
</style>
</head>
<body>
<div class="c">
<div class="h">钢筋套筒产品追溯</div>
<div id="content"></div>
</div>
<script>
const FIELD_LABELS = [
  "产品名称","规格型号","执行标准","数量","重量",
  "生产批号","生产日期","生产厂家","地址/电话",
  "适用钢筋","原材料牌号","原材料炉号","接头性能等级",
  "产品合格证编号","型式检验报告编号"
];

function b64urlDecode(str) {
  try {
    let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    const bin = atob(b64);
    return new TextDecoder('utf-8').decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
  } catch(e) { return null; }
}

function renderTable(values) {
  if (!values || values.length < 15) {
    return '<div class="e">追溯数据不完整，请确认二维码正确</div>';
  }
  let html = '<table><tr><th colspan="2">基础信息</th></tr>';
  for (let i = 0; i < 9; i++) {
    html += '<tr><td class="l">' + FIELD_LABELS[i] + '</td><td>' + escapeHtml(values[i]) + '</td></tr>';
  }
  html += '</table><table><tr><th colspan="2">质量追溯</th></tr>';
  for (let i = 9; i < 15; i++) {
    html += '<tr><td class="l">' + FIELD_LABELS[i] + '</td><td>' + escapeHtml(values[i]) + '</td></tr>';
  }
  html += '</table><div class="t" id="clock"></div>';
  return html;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

const el = document.getElementById('content');
const params = new URLSearchParams(location.search);
const data = params.get('d');

if (data) {
  const raw = b64urlDecode(data);
  if (raw) {
    const values = raw.split('|');
    el.innerHTML = renderTable(values);
    startClock();
  } else {
    el.innerHTML = '<div class="e">追溯数据解析失败，请确认二维码正确</div>';
  }
} else {
  el.innerHTML = '<div class="e">请扫描产品追溯二维码</div>';
}

function startClock() {
  function tick() {
    const c = document.getElementById('clock');
    if (c) {
      const now = new Date();
      c.textContent = now.toLocaleString('zh-CN', {hour12: false});
    }
  }
  tick();
  setInterval(tick, 1000);
}
</script>
</body>
</html>
